name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TELEMETRY: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7

      - id: get-run-id
        run: |
          echo "run_id=$(gh run list \
            --workflow tests.yml \
            --commit ${{ github.sha }} \
            --status success \
            --json databaseId \
            --jq '.[0].databaseId')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.get-run-id.outputs.run_id }}
          skip-decompress: true

      - run: mv worddumb-${{ github.sha }}.zip worddumb-${{ github.ref_name }}.zip

      - name: Create relase
        run: gh release create ${{ github.ref_name }} worddumb-${{ github.ref_name }}.zip
