name: Lint Code Base

on:
  push:
    branches:  # ignore pushed tags
      - "*"
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - run: |
          uv python install
          uv tool install mypy
          uv tool run mypy .
          uv tool run mypy __main__.py
      - run: |
          uv tool install ruff
          uv tool run ruff check --output-format=github
          uv tool run ruff format --check --output-format=github
